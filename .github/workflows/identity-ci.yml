name: Identity CI

on:
  push:
    paths:
      - 'services/Identity/**'
      - '.github/workflows/identity-ci.yml'
  pull_request:
    paths:
      - 'services/Identity/**'
      - '.github/workflows/identity-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build services/Identity/Identity.slnx --configuration Release
      - run: dotnet test services/Identity/Identity.slnx --configuration Release --no-build
